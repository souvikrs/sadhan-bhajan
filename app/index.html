<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sadhan Bhajan</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14212B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="সাধন ভজন">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Noto+Serif+Bengali:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="lock" class="lock">
  <div class="lock-inner">
    <img src="icons/mw-mark.svg" alt="" class="lock-mark">
    <h1 class="brand">Sadhan Bhajan</h1>
    <p class="brand-sub">(for Thakur &amp; Souvik)</p>
    <p class="brand-bn">সাধন ভজন</p>
    <form id="lockForm" autocomplete="off">
      <input id="pass" type="password" inputmode="numeric" maxlength="64" placeholder="••••••••" aria-label="Password" autocomplete="off">
      <button class="btn primary" type="submit">খুলুন · Open</button>
      <p id="lockMsg" class="lock-msg" aria-live="polite"></p>
    </form>
  </div>
</section>

<div id="app" class="app" hidden>
  <header class="top">
    <div class="top-title"><span class="t-en">Sadhan Bhajan</span> <span class="t-sub">(for Thakur &amp; Souvik)</span></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
  </header>
  <main id="view" class="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="on"><span class="ti">◐</span><span>আজ</span></button>
    <button data-tab="sit"><span class="ti">◯</span><span>বসা</span></button>
    <button data-tab="prayer"><span class="ti">✦</span><span>প্রার্থনা</span></button>
    <button data-tab="read"><span class="ti">❒</span><span>পাঠ</span></button>
    <button data-tab="log"><span class="ti">▦</span><span>খাতা</span></button>
  </nav>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="dark" class="dark" hidden></div>

<script src="app.js"></script>
</body>
</html>
